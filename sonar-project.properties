# ============================================================
# SonarQube — BE (Bun + Express + TypeScript)
# ============================================================
# PENTING: key & name BERBEDA dari FE (…proyek1) supaya hasil
# scan BE tidak menimpa dashboard FE.
# ============================================================

sonar.projectKey=ifs24039-pabwe2026-proyek1-be
sonar.projectName=ifs24039-pabwe2026-proyek1-be

# Source & test keduanya di src/ karena test BE colocated:
#   src/app.ts
#   src/app.test.ts
#   src/auth/authService.ts
#   src/auth/authService.test.ts
#   ...
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.sourceEncoding=UTF-8

# Coverage dari `bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# File yang tidak masuk hitungan:
#  - node_modules, coverage, dist, build
#  - file test itu sendiri (sudah masuk sonar.tests)
#  - declaration file hasil build (.d.ts)
sonar.exclusions=node_modules/**,coverage/**,dist/**,build/**,.bun/**,**/*.test.ts,**/*.spec.ts,**/*.d.ts

# Jangan analisis file duplikat dari test sebagai source
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts