# ============================================================
# SonarQube — BE (Bun + Express + TypeScript)
# ============================================================
# PENTING: key & name BERBEDA dari FE (…proyek1) supaya hasil
# scan BE tidak menimpa dashboard FE.
# ============================================================

sonar.projectKey=ifs24039-pabwe2026-proyek1-be
sonar.projectName=ifs24039-pabwe2026-proyek1-be

# Source & test sama-sama di src/ karena test BE colocated:
#   src/app.ts        ← source
#   src/app.test.ts   ← test
#   src/auth/authService.ts
#   src/auth/authService.test.ts
#   ...
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.sourceEncoding=UTF-8

# Coverage dari `bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions:
# - node_modules, coverage, dist, build, .bun: folder build/dependency
# - *.test.ts, *.spec.ts: file test (sudah dihitung via sonar.tests)
# - *.d.ts: declaration file
# - src/index.ts: ENTRY POINT (glue code) — hanya memanggil createApp(),
#   app.listen(), dan startWorker(). Tidak punya logika bisnis, jadi
#   coverage 0% di sini JANGAN sampai menggagalkan Quality Gate.
sonar.exclusions=node_modules/**,coverage/**,dist/**,build/**,.bun/**,**/*.test.ts,**/*.spec.ts,**/*.d.ts,src/index.ts

# Kecualikan test dari hitungan duplikasi
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts